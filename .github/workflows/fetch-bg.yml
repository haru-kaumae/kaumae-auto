name: fetch-bg
# 手動で実行：表紙の背景写真（CC0・パブリックドメインのみ）を集めて assets/bg に保存する
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python tools/fetch_backgrounds.py
      - run: |
          git config user.name "kaumae-bot"
          git config user.email "kaumae-bot@users.noreply.github.com"
          git add assets/bg
          git commit -m "背景写真を追加" || echo "変更なし"
          git push
