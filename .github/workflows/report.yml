name: report
# 投稿の数字を集めて、運用マップ（docs/live/）に書く。2時間ごと＋手動。Instagramへは読み取りのみ
on:
  schedule:
    - cron: "30 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: report
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m src.main report
      - name: 運用マップの数字を公開する
        run: |
          git config user.name "kaumae-bot"
          git config user.email "kaumae-bot@users.noreply.github.com"
          git add docs/live
          git commit -m "report: $(date +%F_%H%M)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
