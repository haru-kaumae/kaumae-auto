name: daily
# 毎日13:00と20:00（日本時間）の2回投稿。GitHubの起動が遅れることがあるため1時間前に起動し、時刻まで待ってから投稿する。1回ごとにカルーセル・リール・ストーリーズを1本ずつ
on:
  schedule:
    - cron: "0 3 * * *"    # 13:00の回
    - cron: "0 10 * * *"   # 20:00の回
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1にすると投稿せず、画像と原稿だけ作る"
        default: "1"
      force_feed:
        description: "1にすると曜日に関係なくフィードを作る（試運転用）"
        default: "1"
      slot:
        description: "1＝13:00の回、2＝20:00の回"
        default: "1"
permissions:
  contents: write
  issues: write
concurrency: daily
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL }}
      DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || '0' }}
      FORCE_FEED: ${{ github.event.inputs.force_feed || '0' }}
      SLOT: ${{ github.event.inputs.slot || (github.event.schedule == '0 10 * * *' && '2') || '1' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-ipafont-gothic ffmpeg
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: 原稿と画像を作る（規約チェックつき）
        run: python -m src.main daily
      - name: 画像とリンク一覧ページを公開する
        run: |
          git config user.name "kaumae-bot"
          git config user.email "kaumae-bot@users.noreply.github.com"
          git add docs state
          git commit -m "daily: $(date +%F)" || echo "変更なし"
          git pull --rebase -q || true
          git push
      - name: 投稿時刻（13:00か20:00）まで待つ（手動実行の時は待たない）
        if: github.event_name == 'schedule'
        run: |
          [ "$SLOT" = "2" ] && hh=11:00 || hh=04:00
          now=$(date -u +%s); target=$(date -u -d "today $hh" +%s)
          if [ "$now" -lt "$target" ]; then sleep $((target - now)); fi
      - name: Instagramに投稿する
        run: python -m src.main publish
      - name: 投稿結果を記録する
        if: always()
        run: |
          git add docs state
          git commit -m "publish: $(date +%F)" || echo "変更なし"
          git pull --rebase -q || true
          git push
      - name: 問題があればIssueで知らせる
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -s alerts_new.md ]; then
            gh issue create --title "【要確認】自動投稿で止まったもの $(date +%F)" --body-file alerts_new.md
          fi
